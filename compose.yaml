services:
  postgres:
    image: postgres:19-alpine
    environment:
      POSTGRES_USER: brightsmile
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the .env file}
      POSTGRES_DB: brightsmile
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U brightsmile -d brightsmile"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
